name: Style request
description: Ask for a new video style
labels: [style-request]
body:
  - type: textarea
    id: look
    attributes:
      label: What should it look like?
      description: Describe the colours, the drawing, the camera and the mood. A link to an example video helps.
    validations:
      required: true
  - type: input
    id: topics
    attributes:
      label: What kind of videos would you make with it?
