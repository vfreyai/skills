<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="vfrey/fonts/fonts.css" />
<script src="vfrey/gsap.min.js"></script>
<script src="vfrey/vfrey.js"></script>
<!-- STARTER (vfrey-style-screen-demo). Replace every PLACEHOLDER text and the invented app name; keep the structure.
     Camera = kf list, cursor = cursorWp list, both pure functions of time. View-local to world is +30 (x), +214 (y). -->
<style>
  :root { --acc:#4f5df5; --accSoft:rgba(79,93,245,.14); --ink:#171c30; --mut:#6c7389; --line:#e6e9f2; --bg:#e9edf6; }
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  *{box-sizing:border-box}
  #root{position:relative;width:100%;height:100%;background:var(--bg);font-family:"Google Sans Flex","Baloo 2",sans-serif;color:var(--ink);overflow:hidden}
  #backdrop{position:absolute;inset:-200px}
  .blob{position:absolute;border-radius:50%}
  #cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
  #win{position:absolute;left:30px;top:150px;width:1020px;height:2600px;background:#fff;border-radius:40px 40px 0 0;box-shadow:0 40px 110px rgba(30,40,90,.30),0 6px 22px rgba(30,40,90,.12);overflow:hidden}
  #titlebar{position:absolute;left:0;top:0;width:100%;height:64px;background:#f5f6fb;border-bottom:1px solid var(--line);z-index:5}
  .dot{position:absolute;top:23px;width:18px;height:18px;border-radius:50%;background:#d5d9e6}
  #apptitle{position:absolute;left:0;width:100%;top:15px;text-align:center;font-weight:700;font-size:26px;color:var(--mut)}
  .view{position:absolute;left:0;top:64px;width:1020px;height:2536px;background:#fff;overflow:hidden}
  #listHead{position:absolute;left:40px;top:22px;font-size:54px;font-weight:800}
  #listSub{position:absolute;left:300px;top:41px;font-size:28px;color:var(--mut)}
  #search{position:absolute;right:40px;top:26px;width:300px;height:56px;border-radius:28px;background:#f0f2f8;color:var(--mut);font-size:24px;line-height:56px;padding-left:24px}
  .row{position:absolute;left:0;width:1020px;height:150px;border-top:1px solid var(--line)}
  .rowbg{position:absolute;inset:0;background:var(--accSoft);opacity:0}
  .av{position:absolute;left:40px;top:33px;width:84px;height:84px;border-radius:50%;color:#fff;font-weight:800;font-size:38px;text-align:center;line-height:84px}
  .rs{position:absolute;left:152px;top:24px;font-size:34px;font-weight:700;white-space:nowrap}
  .rj{position:absolute;left:152px;top:70px;font-size:29px;font-weight:600;white-space:nowrap;color:#2a3047}
  .rp{position:absolute;left:152px;top:107px;font-size:25px;color:var(--mut);white-space:nowrap}
  .rt{position:absolute;right:40px;top:30px;font-size:24px;color:var(--mut)}
  #detail{left:1020px}
  #bar{position:absolute;left:0;top:0;width:1020px;height:86px;border-bottom:1px solid var(--line)}
  #back{position:absolute;left:40px;top:22px;font-size:32px;font-weight:700;color:var(--acc)}
  #title{position:absolute;left:40px;top:108px;width:940px;font-size:46px;line-height:56px;font-weight:800}
  .bt{position:absolute;left:40px;width:940px;font-size:36px;line-height:54px}
  #key{position:absolute;left:40px;top:330px;width:560px;height:92px;border-radius:20px;background:#f3f5fb;border:2px solid var(--line)}
  #keyl{position:absolute;left:28px;top:0;font-size:26px;line-height:88px;color:var(--mut);font-weight:600}
  #keyv{position:absolute;right:28px;top:0;font-family:"JetBrains Mono",monospace;font-size:44px;line-height:88px;font-weight:800}
  #cta{position:absolute;left:40px;top:520px;width:620px;height:122px;border-radius:24px;background:#1d2336;color:#fff;font-weight:800;font-size:38px;line-height:122px;text-align:center;box-shadow:0 10px 24px rgba(23,28,48,.25)}
  #filler{position:absolute;left:0;top:760px;width:1020px;height:1700px}
  .spot{position:absolute;left:0;top:0;width:100px;height:100px;border-radius:26px;box-shadow:0 0 0 3000px rgba(18,22,44,.5);opacity:0;pointer-events:none}
  .callout{position:absolute;left:0;top:0;opacity:0;pointer-events:none}
  .cpill{position:absolute;white-space:nowrap;background:var(--acc);color:#fff;font-weight:800;font-size:30px;padding:0 26px;height:64px;line-height:64px;border-radius:32px;box-shadow:0 12px 30px rgba(79,93,245,.45)}
  .cdot{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--acc);border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);margin:-11px 0 0 -11px}
  svg.lead{position:absolute;left:0;top:0;width:10px;height:10px;overflow:visible;pointer-events:none}
  #loupe{position:absolute;left:0;top:0;width:700px;height:170px;opacity:0;pointer-events:none}
  #lens{position:absolute;inset:0;border-radius:85px;background:rgba(255,255,255,.98);border:9px solid var(--acc);box-shadow:0 30px 80px rgba(20,30,90,.45),inset 0 0 40px rgba(79,93,245,.25);overflow:hidden}
  #lensTxt{position:absolute;inset:0;text-align:center;font-family:"JetBrains Mono",monospace;font-size:40px;font-weight:800;line-height:150px;white-space:nowrap}
  #lensTxt span{color:var(--acc)}
  #lensShine{position:absolute;left:40px;top:10px;width:300px;height:44px;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0))}
  #handle{position:absolute;left:580px;top:130px;width:140px;height:32px;border-radius:16px;background:var(--acc);transform-origin:0 50%;transform:rotate(62deg);box-shadow:0 10px 22px rgba(20,30,90,.35);z-index:-1}
  #cursor{position:absolute;left:0;top:0;width:60px;height:60px;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));transform-origin:0 0}
  .ripple{position:absolute;left:0;top:0;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;border:6px solid var(--acc);background:rgba(79,93,245,.25);opacity:0}
  #tracker{position:absolute;left:0;width:1080px;top:70px;height:96px}
  .tp{position:absolute;top:0;height:84px;border-radius:42px;background:#fff;box-shadow:0 14px 34px rgba(30,40,90,.28);font-weight:800;font-size:31px;line-height:84px;padding-left:84px;white-space:nowrap;color:var(--mut);overflow:hidden}
  .tp .n{position:absolute;left:14px;top:12px;width:60px;height:60px;border-radius:50%;background:#eef0f8;color:var(--mut);text-align:center;line-height:60px;font-size:32px}
  .tp .fillbg{position:absolute;inset:0;background:var(--acc);opacity:0}
  .tp .lbl{position:relative}
  .toast{position:absolute;left:1100px;width:780px;height:150px;border-radius:30px;background:#fff;box-shadow:0 26px 70px rgba(25,32,80,.42);border:2px solid var(--line)}
  .toast .ti{position:absolute;left:26px;top:30px;width:90px;height:90px;border-radius:24px;background:var(--acc);color:#fff;text-align:center;line-height:90px;font-size:46px;font-weight:800}
  .toast .t1{position:absolute;left:140px;top:22px;font-size:22px;color:var(--mut);font-weight:700;letter-spacing:.06em}
  .toast .t2{position:absolute;left:140px;top:52px;font-size:34px;font-weight:800;white-space:nowrap}
  .toast .t3{position:absolute;left:140px;top:102px;font-size:24px;color:var(--mut);white-space:nowrap}
  #capPlate{position:absolute;left:36px;right:36px;border-radius:40px;background:rgba(255,255,255,.97);box-shadow:0 18px 60px rgba(25,32,80,.35),0 2px 8px rgba(25,32,80,.15)}
  #captions{position:absolute;left:var(--vf-safe-left);right:var(--vf-safe-right);top:var(--vf-caption-at);height:var(--vf-caption-h)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0">
  <div id="backdrop">
    <div class="blob" id="b1" style="left:60px;top:80px;width:900px;height:900px;background:radial-gradient(circle,rgba(79,93,245,.28),rgba(79,93,245,0) 65%)"></div>
    <div class="blob" style="left:600px;top:1300px;width:1000px;height:1000px;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 65%)"></div>
  </div>

  <div id="cam">
    <div id="win">
      <div id="titlebar"><div class="dot" style="left:30px"></div><div class="dot" style="left:60px"></div><div class="dot" style="left:90px"></div>
        <div id="apptitle">APP NAME</div></div>
      <div class="view" id="list"><div id="listHead">List title</div><div id="listSub">3 items</div><div id="search">Search</div></div>
      <div class="view" id="detail">
        <div id="bar"><div id="back">&#8249; List title</div></div>
        <div id="title">PLACEHOLDER: headline of the detail view</div>
        <div class="bt" style="top:200px">PLACEHOLDER: a first sentence of supporting detail.</div>
        <div class="bt" id="hl" style="top:262px;font-weight:800">PLACEHOLDER: the sentence the voice points at.</div>
        <div id="key"><div id="keyl">Label</div><div id="keyv">00:00</div></div>
        <div id="cta">Button label</div>
        <div id="filler"></div>
      </div>
    </div>
    <div id="callouts"></div>
    <div id="loupe"><div id="handle"></div><div id="lens"><div id="lensTxt">PLACEHOLDER <span>key part</span></div><div id="lensShine"></div></div></div>
    <svg id="cursor" viewBox="0 0 24 24"><path d="M3 2 L3 19 L8 14.5 L11.2 22 L14.2 20.7 L11 13.4 L18 13 Z" fill="#171c30" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>

  <div id="tracker"></div>
  <div class="toast" id="toast1" style="top:300px"><div class="ti">!</div><div class="t1">APP NAME</div><div class="t2">Toast headline</div><div class="t3">Toast detail line</div></div>
  <div id="capPlate"></div><div id="captions"></div>
</div>

<script>
const tl = vfrey.timeline();
const DUR = vfrey.timing.durationSec;
const OX = 30, VY = 214;
const $ = s => document.querySelector(s);
const E = n => gsap.parseEase(n);
const P = (lx,ly) => [OX+lx, VY+ly];

/* ---------- content: list rows (6 are enough, then filler so the window never ends) ---------- */
const rowsData = [
  ["A","#4f5df5","Item one","PLACEHOLDER subject line one","PLACEHOLDER preview text of the first item","9:41"],
  ["B","#e48a5c","Item two","PLACEHOLDER subject line two","PLACEHOLDER preview text of the second item","8:15"],
  ["C","#5aa6a0","Item three","PLACEHOLDER subject line three","PLACEHOLDER preview text of the third item","Mon"],
  ["D","#9a7bd8","Item four","PLACEHOLDER subject line four","PLACEHOLDER preview text","Mon"],
  ["E","#d0698a","Item five","PLACEHOLDER subject line five","PLACEHOLDER preview text","Sun"],
  ["F","#5c8fd6","Item six","PLACEHOLDER subject line six","PLACEHOLDER preview text","Sat"],
  ["G","#7aa35a","Item seven","PLACEHOLDER subject line seven","PLACEHOLDER preview text","Fri"],
  ["H","#c79a3c","Item eight","PLACEHOLDER subject line eight","PLACEHOLDER preview text","Fri"],
  ["I","#7d8aa6","Item nine","PLACEHOLDER subject line nine","PLACEHOLDER preview text","Thu"],
  ["J","#b77a6a","Item ten","PLACEHOLDER subject line ten","PLACEHOLDER preview text","Thu"],
  ["K","#6aa0b7","Item eleven","PLACEHOLDER subject line eleven","PLACEHOLDER preview text","Wed"],
  ["L","#a77ad0","Item twelve","PLACEHOLDER subject line twelve","PLACEHOLDER preview text","Wed"],
  ["M","#d08a4c","Item thirteen","PLACEHOLDER subject line thirteen","PLACEHOLDER preview text","Tue"],
  ["N","#58a07a","Item fourteen","PLACEHOLDER subject line fourteen","PLACEHOLDER preview text","Tue"],
  ["O","#c9677d","Item fifteen","PLACEHOLDER subject line fifteen","PLACEHOLDER preview text","Mon"],
  ["P","#7a86d0","Item sixteen","PLACEHOLDER subject line sixteen","PLACEHOLDER preview text","Mon"],
];
rowsData.forEach((r,i)=>{
  const d=document.createElement("div"); d.className="row"; d.id="row"+i; d.style.top=(110+i*150)+"px";
  d.innerHTML=`<div class="rowbg"></div><div class="av" style="background:${r[1]}">${r[0]}</div><div class="rs">${r[2]}</div><div class="rj">${r[3]}</div><div class="rp">${r[4]}</div><div class="rt">${r[5]}</div>`;
  $("#list").appendChild(d);
});
rowsData.slice(0,8).forEach((r,j)=>{ const d=document.createElement("div"); d.className="row"; d.style.top=(j*150)+"px";
  d.innerHTML=`<div class="av" style="background:${r[1]}">${r[0]}</div><div class="rs" style="font-weight:600">${r[2]}</div><div class="rj" style="font-weight:500">${r[3]}</div><div class="rp">${r[4]}</div><div class="rt">${r[5]}</div>`; $("#filler").appendChild(d); });
/* tracker pills (screen space, y 70) */
const trw=[300,300,300], trn=["Step one","Step two","Step three"];
(function(){ let x=(1080-(trw[0]+trw[1]+trw[2]+48))/2;
  trw.forEach((w,i)=>{ const d=document.createElement("div"); d.className="tp"; d.id="tp"+i; d.style.left=x+"px"; d.style.width=w+"px";
    d.innerHTML=`<div class="fillbg"></div><div class="n" id="tn${i}">${i+1}</div><span class="lbl" id="tl${i}">${trn[i]}</span>`; $("#tracker").appendChild(d); x+=w+24; }); })();

/* ---------- helpers: callout with leader, spotlight ---------- */
function callout(id, text, px, py, tx, ty, t0, t1){
  const c=document.createElement("div"); c.className="callout"; c.id=id;
  c.innerHTML=`<svg class="lead"><path d="" fill="none" stroke="#4f5df5" stroke-width="6" stroke-linecap="round"/></svg><div class="cpill" style="left:${px}px;top:${py}px">${text}</div><div class="cdot" style="left:${tx}px;top:${ty}px"></div>`;
  $("#cam").insertBefore(c,$("#cursor"));
  const pill=c.querySelector(".cpill"), dot=c.querySelector(".cdot"), path=c.querySelector("path");
  const pw=pill.offsetWidth, sx=Math.min(Math.max(tx,px+30),px+pw-30), sy=ty>py?py+64:py;
  path.setAttribute("d",`M${sx} ${sy} L${tx} ${ty}`);
  const L=Math.hypot(tx-sx,ty-sy); path.style.strokeDasharray=L; path.style.strokeDashoffset=L;
  tl.set(c,{opacity:0},0);
  tl.fromTo(c,{opacity:0},{opacity:1,duration:.12,immediateRender:false},t0);
  tl.fromTo(pill,{scale:.6,transformOrigin:"50% 50%"},{scale:1,duration:.4,ease:"back.out(2)",immediateRender:false},t0);
  tl.fromTo(path,{strokeDashoffset:L},{strokeDashoffset:0,duration:.4,ease:"power2.out",immediateRender:false},t0+.12);
  tl.fromTo(dot,{scale:0},{scale:1,duration:.3,ease:"back.out(3)",immediateRender:false},t0+.35);
  tl.to(c,{opacity:0,duration:.25},t1);
}
function spot(x,y,w,h,t0,t1){
  const s=document.createElement("div"); s.className="spot"; $("#cam").insertBefore(s,$("#callouts"));
  tl.set(s,{left:x,top:y,width:w,height:h,opacity:0},0);
  tl.fromTo(s,{opacity:0},{opacity:1,duration:.4,ease:"power2.out",immediateRender:false},t0);
  tl.to(s,{opacity:0,duration:.35},t1);
}

/* ---------- camera and cursor: pure functions of time ---------- */
const kf = [ // [t, focusX, focusY, zoom, screenY]  (focus point lands at screen (540,screenY))
 [0.0, 540, 560, 1.00, 640],
 [1.5, 540, 520, 1.06, 640],
 [3.0, 540, 440, 1.06, 640],
 [4.0, 540, 600, 1.00, 700],
 [4.8, 510, 560, 1.10, 560],   // a push-in that keeps the 940 px text column inside the frame (at 1.4 the lines were cut at the edge)
 [7.0, 510, 560, 1.10, 560],
 [8.0, 540, 760, 1.00, 640],
 [12.0,540, 760, 1.00, 660],
];
const cursorWp = [ // [tStart, tEnd, x, y]  world coordinates
 [0.0, 0.0, 930, 1180],
 [0.3, 1.6, 540, 396],
 [2.6, 3.4, 520, 402],
 [4.4, 5.6, 330, 700],
 [7.2, 8.0, 660, 920],
];
function camAt(t){
  let a=kf[0],b=kf[0];
  if(t>=kf[kf.length-1][0]){a=b=kf[kf.length-1];}
  else for(let i=0;i<kf.length-1;i++){ if(t>=kf[i][0]&&t<kf[i+1][0]){a=kf[i];b=kf[i+1];break;} }
  const f=(b[0]===a[0])?1:E("power2.inOut")((t-a[0])/(b[0]-a[0]));
  const m=(u,v)=>u+(v-u)*f;
  return {fx:m(a[1],b[1]),fy:m(a[2],b[2]),k:Math.exp(m(Math.log(a[3]),Math.log(b[3]))),cy:m(a[4],b[4])};
}
function curAt(t){
  let x=cursorWp[0][2],y=cursorWp[0][3];
  for(let i=1;i<cursorWp.length;i++){
    const w=cursorWp[i];
    if(t>=w[1]){x=w[2];y=w[3];continue;}
    if(t>w[0]){
      const f=E("power3.inOut")((t-w[0])/(w[1]-w[0]));
      const dx=w[2]-x,dy=w[3]-y,d=Math.hypot(dx,dy),s=(i%2?1:-1)*0.14*d;
      const cx=x+dx/2-dy/d*s,cy=y+dy/2+dx/d*s,u=1-f;
      return [u*u*x+2*u*f*cx+f*f*w[2],u*u*y+2*u*f*cy+f*f*w[3]];
    }
    break;
  }
  return [x,y];
}
const clicks=[3.4];
const camEl=$("#cam"),curEl=$("#cursor"),bgEl=$("#backdrop"),keyv=$("#keyv");
function tick(){
  const t=tl.time(), c=camAt(t);
  camEl.style.transform=`translate(540px,${c.cy}px) scale(${c.k}) translate(${-c.fx}px,${-c.fy}px)`;
  bgEl.style.transform=`translate(${-(c.fx-540)*.08}px,${-(c.fy-960)*.06}px)`;
  const [x,y]=curAt(t);
  let ps=1; for(const ct of clicks){ if(t>ct-.02&&t<ct+.18) ps=.8; }
  const s=(1.3/Math.pow(c.k,.4))*ps;
  curEl.style.transform=`translate(${x-3*s}px,${y-2*s}px) scale(${s})`;
  const secs=86399-Math.floor(t), m=Math.floor(secs%3600/60), ss=secs%60;   // a countdown: function of time
  keyv.textContent=String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");
}
tl.to({},{duration:DUR,onUpdate:tick,ease:"none"},0);
tl.eventCallback("onUpdate",tick);
vfrey.onFrame(tick);   // what a render runs: onUpdate does not fire when the renderer seeks
clicks.forEach(ct=>{
  const [x,y]=curAt(ct);
  const r=document.createElement("div"); r.className="ripple"; $("#cam").insertBefore(r,curEl);
  tl.set(r,{left:x,top:y,opacity:0,scale:.2},0);
  tl.fromTo(r,{scale:.2,opacity:.95},{scale:1.7,opacity:0,duration:.6,ease:"power2.out",immediateRender:false},ct);
});

/* ---------- shots ---------- */
// Shot 1 hook: list, spotlight on row 0, two callouts
tl.to("#row0 .rowbg",{opacity:1,duration:.35},1.4);
spot(OX,VY+104,1020,162,1.2,3.3);
callout("c0","PLACEHOLDER claim",P(190,0)[0],P(190,0)[1]+40,P(250,128)[0],P(250,128)[1]-6,1.5,3.2);
[0,1,2].forEach(i=>{ tl.set("#tp"+i,{y:-160,opacity:0},0); tl.fromTo("#tp"+i,{y:-160,opacity:0},{y:0,opacity:1,duration:.5,ease:"back.out(1.6)",immediateRender:false},0.4+i*.18); });
function activate(i,t){ tl.to("#tp"+i+" .fillbg",{opacity:1,duration:.3},t); tl.to("#tl"+i,{color:"#fff",duration:.3},t); tl.to("#tn"+i,{backgroundColor:"rgba(255,255,255,.25)",color:"#fff",duration:.3},t); tl.fromTo("#tp"+i,{scale:1},{scale:1.08,duration:.25,yoyo:true,repeat:1,ease:"power2.out",immediateRender:false},t); }
activate(0,0.9);
// Transition: list slides out left, detail in from the right under a pull-out
tl.fromTo("#list",{x:0,opacity:1},{x:-420,opacity:0,duration:.8,ease:"power3.inOut",immediateRender:false},3.5);
tl.fromTo("#detail",{x:0},{x:-1020,duration:.8,ease:"power3.inOut",immediateRender:false},3.5);
// Shot 2 loupe: highlight a sentence, loupe shows it larger
spot(OX+10,VY+64+250,1000,80,5.0,7.0);
tl.fromTo("#hl",{color:"#171c30"},{color:"#4f5df5",duration:.3,immediateRender:false},5.0);
tl.set("#loupe",{left:P(20,0)[0],top:P(0,380)[1],opacity:0},0);
tl.fromTo("#loupe",{opacity:0,scale:.7,y:-50,transformOrigin:"50% 0%"},{opacity:1,scale:1,y:0,duration:.55,ease:"back.out(1.5)",immediateRender:false},5.4);
tl.fromTo("#loupe",{y:0},{y:10,duration:1.2,ease:"sine.inOut",yoyo:true,repeat:1,immediateRender:false},5.9);
tl.to("#loupe",{opacity:0,y:-30,scale:.92,duration:.4,ease:"power2.in"},7.4);
// Shot 3 toast + button
tl.fromTo("#toast1",{x:0},{x:-910,duration:.55,ease:"power3.out",immediateRender:false},8.2);
tl.to("#toast1",{x:0,duration:.5,ease:"power3.in"},10.4);
tl.fromTo("#b1",{scale:1},{scale:1.12,duration:6,ease:"sine.inOut",yoyo:true,repeat:1,immediateRender:false},0);

{const cb=vfrey.captionBox; const p=$("#capPlate").style; p.top=(cb.top+cb.height-180)+"px"; p.height="205px";}
vfrey.captions("#captions",{style:"box",color:"#171c30",highlight:"#4f5df5",maxWords:3});
/* UI text the push-in carries past the frame edge (a weekday in the corner of the list) is hidden there, never cut (frames.off-frame) */
vfrey.keepInFrame(Array.from(document.querySelectorAll("#root *")).filter((e) => !e.children.length && e.textContent.trim() && !e.closest("#captions")));
tick();
</script>
