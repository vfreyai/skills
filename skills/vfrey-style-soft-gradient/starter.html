<!doctype html>
<!-- STARTER (vfrey-style-soft-gradient). Mesh-gradient moods that cross-fade, frosted glass cards floating in gentle parallax, glossy icons,
     a dial, a dock, glass beads, a glass caption plate. Replace PLACEHOLDER text, the moods and the beat times (use sentence/word starts from
     vfrey.timing.words: S(i), WD(/regex/)). Opacity is only ever tweened on a widget's CHILDREN, never on the widget (backdrop-filter). -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="vfrey/fonts/fonts.css" />
<script src="vfrey/gsap.min.js"></script>
<script src="vfrey/vfrey.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #17143f; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #17143f; font-family: "Google Sans Flex", sans-serif; color: #241c4e; }
  #frame { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; }
  #bg, #bokeh, #stage, #fore, #grain, #soft { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #bg { z-index: 0; isolation: isolate; } #bokeh { z-index: 1; } #stage { z-index: 2; } #fore { z-index: 3; }
  .ph { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; opacity: 0; }
  .blob, .bk { position: absolute; border-radius: 50%; }
  .w { position: absolute; } .w > * { position: absolute; }
  .glass { box-sizing: border-box; border-radius: 64px; background: linear-gradient(145deg, rgba(255,255,255,.46) 0%, rgba(255,255,255,.20) 46%, rgba(255,255,255,.12) 100%);
    -webkit-backdrop-filter: blur(26px) saturate(1.5); backdrop-filter: blur(26px) saturate(1.5); border: 2px solid rgba(255,255,255,.62);
    box-shadow: 0 36px 80px rgba(46,30,110,.22), 0 6px 18px rgba(46,30,110,.10), inset 0 2.5px 0 rgba(255,255,255,.85), inset 0 -24px 44px rgba(255,255,255,.10), inset 0 0 0 1px rgba(255,255,255,.12); }
  .glass::after { content: ""; position: absolute; left: 5%; right: 5%; top: 2.5%; height: 34%; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0)); }
  .round, .round::after { border-radius: 50%; }
  .pill { box-sizing: border-box; display: flex; align-items: center; justify-content: center; height: 76px; padding: 0 34px 3px; border-radius: 38px; font-size: 40px; font-weight: 650; color: #2a2060; white-space: nowrap;
    background: linear-gradient(180deg, rgba(255,255,255,.90), rgba(255,255,255,.66)); border: 2px solid rgba(255,255,255,.95); box-shadow: 0 16px 36px rgba(46,30,110,.20), inset 0 2px 0 #fff; }
  .ring { inset: 34px; border-radius: 50%; background: conic-gradient(from 0deg, #7fc4ff 0deg, #8fb4ff 40deg, #ff9d8a 92deg, #b06ad9 130deg, #3a2a9a 180deg, #5a3fb8 225deg, #ffb08a 268deg, #ffd98a 300deg, #7fc4ff 360deg);
    -webkit-mask-image: radial-gradient(closest-side, transparent calc(100% - 50px), #000 calc(100% - 48px), #000 calc(100% - 1px), transparent 100%); mask-image: radial-gradient(closest-side, transparent calc(100% - 50px), #000 calc(100% - 48px), #000 calc(100% - 1px), transparent 100%); }
  .ring.dim { opacity: .26; }
  #ringmask { inset: 0; --p: 0; -webkit-mask-image: conic-gradient(from 270deg, #000 calc(var(--p) * 1deg), transparent calc(var(--p) * 1deg + .6deg)); mask-image: conic-gradient(from 270deg, #000 calc(var(--p) * 1deg), transparent calc(var(--p) * 1deg + .6deg)); }
  #ringmask .ring { position: absolute; }
  #hub { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #hubnum { font-size: 150px; font-weight: 750; line-height: .95; color: #2a2060; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  #hubsub { font-size: 44px; font-weight: 600; color: #4a3f8a; margin-top: 2px; }
  .knob { width: 78px; height: 78px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #fffdf0 0%, #ffe07a 38%, #ffab3d 78%, #f58a2a 100%); box-shadow: 0 0 0 5px rgba(255,255,255,.8), 0 0 34px 10px rgba(255,214,120,.85), 0 10px 22px rgba(160,80,20,.3); }
  #dockseg { border-radius: 52px; background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.60)); border: 2px solid #fff; box-shadow: 0 10px 28px rgba(46,30,110,.22), 0 0 34px rgba(255,255,255,.55), inset 0 2px 0 #fff; }
  .meter { border-radius: 24px; background: rgba(46,30,110,.16); box-shadow: inset 0 2px 6px rgba(46,30,110,.22), 0 1.5px 0 rgba(255,255,255,.6); overflow: hidden; }
  .meter > b { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 24px; transform-origin: 0 50%; background: linear-gradient(90deg, #ffb347, #ffe07a 60%, #fffbe0); box-shadow: inset 0 3px 0 rgba(255,255,255,.7); }
  .lbl { font-size: 46px; font-weight: 700; color: #2a2060; text-align: center; white-space: nowrap; }
  #grain { z-index: 60; pointer-events: none; opacity: .13; mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.1 -.1'/></filter><rect width='360' height='360' filter='url(%23n)'/></svg>"); }
  #soft { z-index: 59; pointer-events: none; background: radial-gradient(ellipse at 50% 42%, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 45%, rgba(30,20,80,.16) 100%); }
  #captions { position: absolute; left: 60px; right: 60px; top: var(--vf-caption-at); height: var(--vf-caption-h); z-index: 50; justify-content: center !important; }
  #captions .vf-grp.on { position: relative; padding: 24px 30px 28px; gap: 6px 4px; max-width: 940px; }
  #captions .vf-grp.on::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 48px; background: linear-gradient(180deg, rgba(255,255,255,.90), rgba(255,255,255,.76)); -webkit-backdrop-filter: blur(30px) saturate(1.4); backdrop-filter: blur(30px) saturate(1.4);
    border: 2px solid rgba(255,255,255,.95); box-shadow: 0 26px 60px rgba(40,26,100,.26), 0 4px 12px rgba(40,26,100,.10), inset 0 2.5px 0 #fff; }
  #captions .vf-w { font-weight: 700; letter-spacing: -.005em; border-radius: 26px; padding: 4px 16px 9px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0">
  <div id="frame"><div id="bg"></div><div id="bokeh"></div><div id="stage"></div><div id="fore"></div><div id="soft"></div><div id="grain"></div><div id="captions"></div></div>
</div>
<script>
const tl = vfrey.timeline();
const WORDS = vfrey.timing.words, DUR = vfrey.timing.durationSec;
document.getElementById("frame").style.transform = `scale(${vfrey.frame.width / 1080})`;

/* ---------- timing: sentences and words (S(i) = start of sentence i, WD(/re/) = start of a word) ---------- */
const sents = []; { let cur = null; WORDS.forEach(w => { if (!cur) { cur = { start: w.start, end: w.end }; sents.push(cur); } cur.end = w.end; if (/[.!?]["')]?$/.test(w.text)) cur = null; }); }
const S = i => sents[Math.min(i, sents.length - 1)].start;
const WD = (re, nth = 0, fb = 0) => { const m = WORDS.filter(w => re.test(w.text)); return m.length ? m[Math.min(nth, m.length - 1)].start : fb; };

/* ---------- helpers ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a += 0x6D2B79F5; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const $ = (parent, cls, css, html) => { const e = document.createElement("div"); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; };
const R = (cx, cy, w, h) => `left:${cx - w / 2}px;top:${cy - h / 2}px;width:${w}px;height:${h}px;`;
let uidN = 0; const uid = () => "g" + (++uidN);
const bg = document.getElementById("bg"), bokeh = document.getElementById("bokeh"), stage = document.getElementById("stage"), fore = document.getElementById("fore");
/* a widget = outer point (placed, entered, moved) holding an inner point (floats and sways); children sit around the point */
function widget(cx, cy, z = 5, parent = stage) { const o = $(parent, "w", `left:${cx}px;top:${cy}px;width:0;height:0;z-index:${z};visibility:hidden;`); const i = $(o, "w", "left:0;top:0;width:0;height:0;"); i.o = o; gsap.set([o, i], { transformPerspective: 1500 }); return i; }
const kids = w => [...w.children];
function enter(w, t, o = {}) {   // spring in: scale .84 -> 1, y +70 -> 0, rotationX 14 -> 0; children fade with a .05 s stagger
  tl.set(w.o, { visibility: "visible" }, t);
  tl.fromTo(kids(w), { opacity: 0 }, { opacity: (i, el) => +(el.dataset.o || 1), duration: o.fade || .6, ease: "power2.out", stagger: o.stagger ?? .05, immediateRender: false }, t);
  tl.fromTo(w.o, { scale: o.from ?? .84, y: o.dy ?? 70, rotationX: o.rx ?? 14 }, { scale: o.to ?? 1, y: 0, rotationX: 0, duration: o.dur || 1.25, ease: o.ease || "elastic.out(1,0.9)", immediateRender: false }, t);
}
function exit(w, t, o = {}) { const d = o.dur || .5;
  tl.to(kids(w), { opacity: 0, duration: d * .9, ease: "power2.in" }, t);
  tl.to(w.o, { scale: o.to ?? .9, y: o.dy ?? -60, rotationX: o.rx ?? -8, duration: d, ease: "power2.in" }, t);
  tl.set(w.o, { visibility: "hidden" }, t + d + .02); }
function sway(w, amp = 12, ry = 5, seed = 1) { const r = rng(seed), d = 3.6 + r() * 2.4, s = r() < .5 ? -1 : 1;   // ambient: every widget floats; finite repeats only
  tl.fromTo(w, { y: -amp * s, rotationY: -ry * s, rotation: -.7 * s }, { y: amp * s, rotationY: ry * s, rotation: .7 * s, duration: d, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / d) }, 0); }

/* ---------- mesh-gradient moods: base gradient + 5 to 6 big radial blobs that drift (never a lone linear gradient: it bands) ---------- */
const PH = {
  dawn: { base: "linear-gradient(180deg,#ffe3cf 0%,#ffc4a8 55%,#ffb3b3 100%)", blobs: [["#ff9a76", 200, 420, 1150], ["#ffd67a", 930, 250, 1050], ["#ffb5d6", 960, 1150, 1200], ["#fff0dc", 300, 1250, 1000], ["#c7a6ff", 240, 1850, 1000], ["#ffa477", 900, 1880, 900]] },
  day: { base: "linear-gradient(180deg,#d6ecff 0%,#a3d0ff 55%,#b9c4ff 100%)", blobs: [["#63adff", 220, 380, 1200], ["#a8f1ff", 940, 300, 1050], ["#ffffff", 360, 1050, 950], ["#b4bcff", 960, 1250, 1150], ["#ffe9b8", 200, 1800, 950], ["#7fb8ff", 900, 1900, 900]] },
  night: { base: "linear-gradient(180deg,#15123c 0%,#2b2270 52%,#5a3a9e 100%)", stars: 1, blobs: [["#6a4be0", 240, 330, 1150], ["#2b49b8", 980, 860, 1250], ["#b266d9", 180, 1480, 1050], ["#ff8fb0", 960, 1860, 820], ["#2a1f7a", 620, 60, 900]] },
};
const layers = {}; let zTop = 1;
Object.keys(PH).forEach((name, n) => { const p = PH[name], L = $(bg, "ph", `background:${p.base};`), r = rng(11 + n * 7);
  p.blobs.forEach(([c, x, y, d]) => { const b = $(L, "blob", R(x + 60, y + 60, d, d) + `background:radial-gradient(closest-side, ${c}f2 0%, ${c}b0 34%, ${c}40 68%, ${c}00 100%);`);
    const dur = 5.5 + r() * 4.5, a = r() * 6.283, amp = 130 + r() * 90;
    tl.fromTo(b, { x: -Math.cos(a) * amp, y: -Math.sin(a) * amp, scale: .9 + r() * .1 }, { x: Math.cos(a) * amp, y: Math.sin(a) * amp, scale: 1.12 + r() * .12, duration: dur, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / dur) }, 0); });
  if (p.stars) for (let i = 0; i < 16; i++) { const x = 60 + r() * 1080, y = 80 + r() * 1150, s = 16 + r() * 26;
    const st = $(L, "", `position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px;`, `<svg viewBox="-10 -10 20 20" width="${s}" height="${s}"><path d="M0,-10 Q1.6,-1.6 10,0 Q1.6,1.6 0,10 Q-1.6,1.6 -10,0 Q-1.6,-1.6 0,-10Z" fill="#fff"/></svg>`);
    const d = 1.1 + r() * 1.6; tl.fromTo(st, { opacity: .15, scale: .6 }, { opacity: .95, scale: 1.1, duration: d, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / d) }, 0); }
  layers[name] = L; });
let curPhase = "dawn"; gsap.set(layers.dawn, { opacity: 1 });
function phase(name, t, dur = 2.0) { const old = layers[curPhase], L = layers[name]; tl.set(L, { zIndex: ++zTop }, t); tl.fromTo(L, { opacity: 0 }, { opacity: 1, duration: dur, ease: "sine.inOut", immediateRender: false }, t); tl.set(old, { opacity: 0 }, t + dur + .02); curPhase = name; dockTo(name, t + dur * .25); }
/* bokeh discs: the only crisp-edged things behind the glass, so the frosting has something to blur; parallax opposite the stage */
{ const r = rng(5); for (let i = 0; i < 16; i++) { const d = 70 + r() * 210, x = r() * 1080, y = 120 + r() * 1800;
    const b = $(bokeh, "bk", R(x, y, d, d) + `background:radial-gradient(closest-side, rgba(255,255,255,.10) 0%, rgba(255,255,255,.20) 72%, rgba(255,255,255,.50) 90%, rgba(255,255,255,0) 100%);opacity:${.35 + r() * .5};`);
    const dur = 4 + r() * 4; tl.fromTo(b, { x: -30 - r() * 40, y: 60 + r() * 60 }, { x: 30 + r() * 40, y: -80 - r() * 90, duration: dur, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / dur) }, 0); }
  tl.fromTo(bokeh, { x: 18, y: -10 }, { x: -18, y: 14, duration: 6, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 6) }, 0);
  tl.fromTo(stage, { x: -9, y: 6 }, { x: 9, y: -8, duration: 6, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 6) }, 0); }

/* ---------- glossy icon recipe: radial body lit from the top-left, bottom volume radial, 3 px white rim, white highlight ellipse ---------- */
function sunBody() { const a = uid(), b = uid(), c = uid();
  return `<svg viewBox="-200 -200 400 400" width="100%" height="100%" style="overflow:visible"><defs>
  <radialGradient id="${a}" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#fffdf0"/><stop offset=".42" stop-color="#ffdc66"/><stop offset=".82" stop-color="#ffa63a"/><stop offset="1" stop-color="#f58a2a"/></radialGradient>
  <radialGradient id="${b}" cx="50%" cy="100%" r="75%"><stop offset="0" stop-color="#e8591a" stop-opacity=".42"/><stop offset="1" stop-color="#e8591a" stop-opacity="0"/></radialGradient>
  <linearGradient id="${c}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <circle r="122" fill="url(#${a})"/><circle r="122" fill="url(#${b})"/><circle r="119" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
  <ellipse cx="-36" cy="-62" rx="62" ry="34" transform="rotate(-24 -36 -62)" fill="url(#${c})"/><circle cx="52" cy="62" r="9" fill="#fff" fill-opacity=".35"/></svg>`; }
function sunRays() { const a = uid(); let s = ""; for (let i = 0; i < 12; i++) s += `<rect x="-10" y="${i % 2 ? -188 : -196}" width="20" height="${i % 2 ? 36 : 48}" rx="10" fill="url(#${a})" transform="rotate(${i * 30})"/>`;
  return `<svg viewBox="-200 -200 400 400" width="100%" height="100%" style="overflow:visible"><defs><linearGradient id="${a}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3bf"/><stop offset="1" stop-color="#ffb347"/></linearGradient></defs>${s}</svg>`; }

/* ---------- dock: a frosted pill row at y 1655 with 4 mood icons and a sliding segment ---------- */
const dock = $(fore, "w", "left:540px;top:1655px;width:0;height:0;z-index:20;");
$(dock, "glass", R(0, 0, 880, 136) + "border-radius:68px;");
const seg = $(dock, "", R(0, 0, 196, 104)); seg.id = "dockseg";
const DX = [-322.5, -107.5, 107.5, 322.5];
{ const ink = "#3a2c93", warm = "#ff9a3d";
  const g = [`<path d="M10,52 H70" stroke="${ink}" stroke-width="6" stroke-linecap="round"/><path d="M22,50 A18,18 0 0 1 58,50Z" fill="${warm}"/><path d="M40,30 V10 M30,18 L40,8 L50,18" fill="none" stroke="${ink}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`,
    `<circle cx="40" cy="40" r="15" fill="${warm}"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<path d="M40,13 V7" stroke="${ink}" stroke-width="6" stroke-linecap="round" transform="rotate(${a} 40 40)"/>`).join("")}`,
    `<path d="M10,52 H70" stroke="${ink}" stroke-width="6" stroke-linecap="round"/><path d="M22,50 A18,18 0 0 1 58,50Z" fill="#ff7a6a"/><path d="M40,8 V28 M30,20 L40,30 L50,20" fill="none" stroke="${ink}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`,
    `<path d="M52,12 A30,30 0 1 0 68,54 A24,24 0 0 1 52,12Z" fill="#6a56dc" stroke="${ink}" stroke-width="5" stroke-linejoin="round"/><circle cx="20" cy="18" r="4" fill="${ink}"/>`];
  g.forEach((s, i) => $(dock, "", R(DX[i], 0, 80, 80), `<svg viewBox="0 0 80 80" width="80" height="80">${s}</svg>`)); }
const DOCKI = { dawn: 0, day: 1, night: 3 }; let dockNow = 0; gsap.set(seg, { x: DX[0] });
function dockTo(name, t) { const i = DOCKI[name]; if (i === dockNow) return; tl.to(seg, { x: DX[i], duration: 1.1, ease: "elastic.out(1,0.8)" }, t); dockNow = i; }
tl.fromTo(dock, { y: 10 }, { y: -10, duration: 4.2, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 4.2) }, 0);
/* two large glass beads at the edges, down to the bottom, so no area is empty */
[[90, 1500, 300], [1010, 1780, 340]].forEach(([x, y, d], i) => { const b = $(fore, "glass round", R(x, y, d, d) + "z-index:1;"); sway(b, 22, 0, 30 + i); });

/* ---------- scene 1: a hero glass card with a glossy sun and a meter ---------- */
const t1 = 0.3;
const card = widget(540, 640, 5);
$(card, "glass", R(0, 0, 820, 760));
const sunW = $(card, "", R(0, -120, 380, 380)); sunW.innerHTML = sunRays() + `<div style="position:absolute;inset:0">${sunBody()}</div>`; sunW.firstElementChild.style.cssText += ";position:absolute;inset:0";
$(card, "lbl", "left:-300px;top:150px;width:600px;", "PLACEHOLDER headline");
const m1 = $(card, "meter", R(0, 260, 560, 48)); $(m1, "", "left:0;top:0;width:100%;height:100%;").appendChild(document.createElement("b"));
$(card, "pill", "left:-120px;top:310px;", "placeholder tag");
sway(card, 14, 8, 3);
enter(card, t1);
tl.fromTo(sunW, { rotation: -10, scale: .92 }, { rotation: 10, scale: 1.04, duration: 3.2, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 3.2) }, 0);
tl.fromTo(m1.querySelector("b"), { scaleX: .05 }, { scaleX: .8, duration: 1.6, ease: "power3.out", immediateRender: false }, t1 + 1.0);

/* ---------- scene 2: mood change to day; a dial widget springs up, the card exits down and back ---------- */
const t2 = 3.6;
phase("day", t2);
exit(card, t2, { dy: 220, to: .94, rx: 6, dur: .6 });
const dial = widget(540, 700, 5);
$(dial, "glass round", R(0, 0, 760, 760));
$(dial, "ring dim", R(0, 0, 692, 692)).dataset.o = .26;
const ringmask = $(dial, "", R(0, 0, 760, 760)); ringmask.id = "ringmask"; { const r = $(ringmask, "ring", ""); r.style.cssText = "position:absolute;" + R(380, 380, 692, 692); }
const hand = $(dial, "", "left:0;top:0;width:0;height:0;"); $(hand, "knob", "position:absolute;left:-39px;top:-358px;");
const hub = $(dial, "glass round", R(0, 0, 330, 330) + "background:linear-gradient(145deg, rgba(255,255,255,.82), rgba(255,255,255,.52));"); hub.id = "hub";
hub.innerHTML = `<div id="hubnum">0</div><div id="hubsub">units</div>`;
const hubnum = hub.querySelector("#hubnum");
sway(dial, 14, 9, 5);
enter(dial, t2 + .15, { stagger: .04 });
tl.set(hand, { opacity: 0 }, t2 + .1); tl.to(hand, { opacity: 1, duration: .4 }, t2 + .8);
const tSweep = t2 + 1.4, sweepDur = 2.6;
tl.fromTo(hand, { rotation: -90 }, { rotation: 270, duration: sweepDur, ease: "power2.inOut", immediateRender: false }, tSweep);
tl.fromTo(ringmask, { "--p": 0 }, { "--p": 360, duration: sweepDur, ease: "power2.inOut", immediateRender: false }, tSweep);
const ease2 = gsap.parseEase("power2.inOut");
vfrey.onFrame(() => { const f = Math.min(1, Math.max(0, (tl.time() - tSweep) / sweepDur)); hubnum.textContent = Math.round(24 * ease2(f)); });   // a counter is a function of time, drawn from vfrey.onFrame
tl.to(kids(dial), { opacity: 0, duration: .5, ease: "power2.in" }, DUR - 2.2);
tl.set(dial.o, { visibility: "hidden" }, DUR - 1.7);
phase("night", DUR - 2.4);

vfrey.captions("#captions", { style: "box", font: '"Google Sans Flex", sans-serif', size: 66, color: "#221a52", highlight: "#4a36c8", highlightText: "#ffffff", maxWords: 4 });
</script>
</body>
</html>
