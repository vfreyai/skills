<!doctype html>
<!-- Paper cut-out starter: three sheets (title with a walking puppet, a counted number on a torn plate, a dusk ending), parallax layers, ransom-letter lettering, torn foreground strata, paper transitions.
     Copy papercut.js next to this file in the scene folder (cp .agents/skills/vfrey-style-paper-cutout/papercut.js scenes/<idea>/). Replace the PLACEHOLDER words, number and colours; keep the structure.
     Sample script: four lines, any length; scenes are cued from the line starts. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="vfrey/fonts/fonts.css" />
<script src="vfrey/gsap.min.js"></script>
<script src="vfrey/vfrey.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #2a1d14; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Baloo 2", sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; perspective: 2200px; }
  .sc { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; box-shadow: 0 0 80px rgba(20,10,0,.55); backface-visibility: hidden; }
  .ly { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .ly.sh > svg { filter: drop-shadow(0 10px 9px rgba(45,27,12,.38)); }             /* the shadow between paper layers */
  .ly.sh > .ransom, .ly.sh > .plate { filter: drop-shadow(3px 6px 5px rgba(40,24,10,.42)); }
  .cut { stroke: #f6efdd; stroke-width: 5; stroke-linejoin: round; paint-order: stroke; }   /* the pale cut edge */
  .ransom { position: absolute; text-align: center; line-height: 1.12; filter: drop-shadow(3px 5px 4px rgba(35,20,8,.42)); }
  .plate { position: absolute; } .plate > .ransom { filter: none; }
  .rw { display: inline-block; white-space: nowrap; margin: 0 .12em; }
  .chip { display: inline-block; padding: 0 .13em .02em; margin: 0 .025em; line-height: 1.12; }
  #grain, #vig { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
  #grain { z-index: 80; mix-blend-mode: multiply; opacity: .5; } #vig { z-index: 81; }
  /* captions: a torn paper strip in vfrey's caption band */
  #captions { position: absolute; left: var(--vf-safe-left); right: var(--vf-safe-left); top: var(--vf-caption-at); height: var(--vf-caption-h); z-index: 90; }
  #captions .vf-grp.on { position: relative; filter: drop-shadow(3px 6px 5px rgba(35,20,8,.5)); padding: 14px 30px 18px; transform: rotate(-1deg); }
  #captions .vf-grp.on::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #f4ecd8; clip-path: polygon(0 4%, 6% 0, 20% 3%, 38% 0, 55% 3%, 73% 0, 90% 3%, 100% 0, 99% 40%, 100% 70%, 98% 100%, 80% 97%, 60% 100%, 40% 96%, 20% 100%, 4% 97%, 0 100%, 1% 60%); }
  #captions .vf-w { color: #2d2a26; font-weight: 800; padding: 0 10px 4px; border-radius: 4px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0"><div id="stage"></div><div id="captions"></div></div>
<script src="papercut.js"></script>
<script>

/* ---------- PLACEHOLDER content: a short history beat. Swap the title, labels, number and colours; keep the layers, puppets, strata, plates and the three paper transitions. ---------- */
const INPUTS = { title: "YOUR TITLE", sub: "A SHORT STORY", num: 986, numLabel: "THINGS COUNTED", end: "THE END" };
const tl = vfrey.timeline(); paperStage();
const NL = vfrey.timing.lines.length;
const LN = (i) => vfrey.line(Math.min(i, NL - 1)).start;
const VB = 1920 / vfrey.frame.height, CAP_TOP = vfrey.captionBox.top * VB;   // the caption band, in stage units
const TS = [0, LN(1) - 0.62, LN(Math.max(2, NL - 1)) - 0.62];                // when each scene's transition starts
const DUR = vfrey.timing.durationSec;

/* scene 0: sunset sky, sun, hills, a walking puppet, a ransom-letter title, foreground to the bottom edge */
(function () { const sc = mk("#ecc88f"), t0 = TS[0], t1 = TS[1] + 1, r = rng(11);
  const sky = layer(sc, 0.05); sun(sky.svg, 540, 760, [330, 250, 170], ["#e9a25f", "#e2874a", "#dc6f3f"], 3); cloud(sky.svg, 560, 640, 260, C.paper, r);
  const far = layer(sc, 0.25); ridge(far.svg, { y: 900, amp: 50, step: 90, fill: "#d98f5a", seed: 2 });
  const mid = layer(sc, 0.5);  ridge(mid.svg, { y: 1080, amp: 40, step: 80, fill: "#c4704a", seed: 3, torn: true });
  const gnd = layer(sc, 0.9);  ridge(gnd.svg, { y: CAP_TOP - 120, amp: 16, step: 80, fill: C.rust, seed: 4 });
  const who = layer(sc, 1.0);  const P = Person(who.svg, { x: 300, y: CAP_TOP - 110, s: 1.8, seed: 4, shirt: C.teal, pants: C.deepteal, hat: "straw" });
  personWalk(P, t0, t0 + 2.4); tl.to(P.mv, { x: 220, duration: 2.4, ease: STEP(2.4) }, t0);
  personIdle(P, t0 + 2.4, t1, { aA: 10, fA: -50 });
  const txt = layer(sc, null, { html: true });
  const ttl = ransom(txt.div, INPUTS.title, { x: 90, y: 150, w: 900, size: 140, seed: 7 }); popChips(ttl.chips, t0 + 0.15, 0.04);
  const sub = ransom(txt.div, INPUTS.sub, { x: 90, y: 470, w: 900, size: 56, seed: 9 }); popChips(sub.chips, t0 + 0.7, 0.04);
  fore(sc, { c1: "#6b3a2a", c2: "#4a2a20", fence: "#3a241a", seed: 11, y1: CAP_TOP + 80, y2: CAP_TOP + 280 });
  cam(sc, t0, t1 - t0, { x: 0, y: 0, z: 0 }, { x: -90, y: -10, z: 0.05 }); })();

/* scene 1: a big counted number on a torn plate, a teal ground, a puppet that salutes */
(function () { const sc = mk("#8fb3a8"), t0 = TS[1], t1 = TS[2] + 1, r = rng(21), o = { n: 0 };
  const sky = layer(sc, 0.05); starburst(sky.svg, 540, 700, 900, 520, 16, "#a3c4b8", r); cloud(sky.svg, 200, 520, 240, C.paper, r);
  const far = layer(sc, 0.25); ridge(far.svg, { y: 1000, amp: 40, step: 90, fill: C.deepteal, seed: 5 });
  const gnd = layer(sc, 0.9);  ridge(gnd.svg, { y: CAP_TOP - 100, amp: 14, step: 80, fill: C.olive, seed: 6 });
  const who = layer(sc, 1.0);  const P = Person(who.svg, { x: 760, y: CAP_TOP - 90, s: 1.8, seed: 8, shirt: C.brick, pants: C.dkbrown, hat: "straw" });
  personIdle(P, t0, t0 + 1.2, { aA: 10, fA: -50 }); personPose(P, { aA: -118, fA: 128 }, t0 + 1.2); personIdle(P, t0 + 1.6, t1, { aA: -20, fA: 30 });
  const txt = layer(sc, null, { html: true });
  const pl = plate(txt.div, 130, 230, 820, 380, C.cream, 3, -2.5);
  const num = H("div", "", txt.div, { left: "130px", top: "270px", width: "820px", textAlign: "center", font: "400 250px 'Titan One', 'Baloo 2', sans-serif", color: C.ink, lineHeight: "1" });
  const lab = ransom(txt.div, INPUTS.numLabel, { x: 190, y: 520, w: 700, size: 52, seed: 12 });
  tl.set([pl, num], { autoAlpha: 0 }, 0); tl.set([pl, num], { autoAlpha: 1, scale: 1.3 }, t0 + 0.5).set([pl, num], { scale: 1 }, t0 + 0.6);
  tl.to(o, { n: INPUTS.num, duration: 1.4, ease: "steps(14)" }, t0 + 0.6); vfrey.onFrame(() => { num.textContent = Math.round(o.n); });
  popChips(lab.chips, t0 + 1.2, 0.04);
  fore(sc, { c1: "#4c6b52", c2: "#34503e", fence: "#2b3d31", seed: 21, y1: CAP_TOP + 80, y2: CAP_TOP + 280 });
  cam(sc, t0, t1 - t0, { x: 0, y: 0, z: 0 }, { x: 70, y: -12, z: 0.06 }); })();

/* scene 2: dusk, the puppet walks off, a hanging sign with the last words */
(function () { const sc = mk("#d9a79b"), t0 = TS[2], r = rng(31);
  const sky = layer(sc, 0.05); sun(sky.svg, 540, 900, [300, 230, 160], ["#e8c09c", "#e3b08c", "#dca07d"], 5); cloud(sky.svg, 640, 560, 280, "#ebd3c8", r);
  const far = layer(sc, 0.25); ridge(far.svg, { y: 1000, amp: 50, step: 90, fill: "#8d5a68", seed: 7 });
  const gnd = layer(sc, 0.9);  ridge(gnd.svg, { y: CAP_TOP - 110, amp: 16, step: 80, fill: "#6c4559", seed: 8 });
  const who = layer(sc, 1.0);  const P = Person(who.svg, { x: 520, y: CAP_TOP - 100, s: 1.8, seed: 12, shirt: C.gold, pants: C.dkbrown, hat: "straw" });
  personWalk(P, t0 + 0.4, DUR, { seed: 9 }); tl.to(P.mv, { x: 700, duration: DUR - t0 - 0.4, ease: STEP(DUR - t0 - 0.4) }, t0 + 0.4);
  const txt = layer(sc, null, { html: true });
  const ttl = ransom(txt.div, INPUTS.end, { x: 140, y: 200, w: 800, size: 170, seed: 15 }); popChips(ttl.chips, t0 + 0.9, 0.05);
  fore(sc, { c1: "#4d2f3d", c2: "#2f1d28", fence: "#24161e", seed: 31, y1: CAP_TOP + 80, y2: CAP_TOP + 280 });
  cam(sc, t0, DUR - t0, { x: 0, y: 0, z: 0 }, { x: -60, y: -8, z: 0.05 }); })();
slide(1, TS[1], "right"); fold(2, TS[2]);   // after every scene is built; tear(i, t) is the third kind
</script>
<script>
  /* still paper grain and a soft vignette, drawn once, above the scenes and below the captions */
  document.getElementById("stage").insertAdjacentHTML("beforeend", `<svg id="grain" viewBox="0 0 1080 1920" width="1080" height="1920"><defs>
    <filter id="fg" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4"/><feColorMatrix type="matrix" values="0 0 0 0 .35  0 0 0 0 .26  0 0 0 0 .16  1.6 0 0 0 -.62"/></filter>
    <filter id="ff" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.34" numOctaves="3" seed="9"/><feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .26  1.9 0 0 0 -.84"/></filter></defs>
    <rect width="1080" height="1920" filter="url(#fg)"/><rect width="1080" height="1920" filter="url(#ff)" opacity=".6"/></svg>
    <svg id="vig" viewBox="0 0 1080 1920" width="1080" height="1920"><defs><radialGradient id="vg" cx="50%" cy="46%" r="75%"><stop offset="55%" stop-color="#2a1608" stop-opacity="0"/><stop offset="100%" stop-color="#2a1608" stop-opacity=".42"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#vg)"/></svg>`);
  vfrey.captions("#captions", { style: "box", font: '"Baloo 2", sans-serif', size: 74, color: "#2d2a26", highlight: "#b2523a", highlightText: "#f4ecd8", maxWords: 4 });

</script>
</body>
</html>
