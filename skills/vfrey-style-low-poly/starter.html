<!doctype html>
<!-- STARTER SHELL (vfrey-style-low-poly). Copy to scenes/<idea>/index.html. The 3D source is starter-scene.js (next to this file): copy it to
     src/<idea>/scene.js and bundle it to scenes/<idea>/scene3d.js (npx esbuild ... in vfrey-style-real-3d helpers.md, section 3). -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="vfrey/fonts/fonts.css" />
<script src="vfrey/gsap.min.js"></script>
<script src="vfrey/vfrey.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #bfe6f2; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #bfe6f2; font-family: "Baloo 2", "Google Sans Flex", sans-serif; color: #fff; }
  #gl { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tilt { position: absolute; left: 0; right: 0; pointer-events: none; opacity: 0.9; backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }
  #tilt-top { top: 0; height: 24%; -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent); }
  #tilt-bot { bottom: 0; height: 26%; -webkit-mask-image: linear-gradient(transparent, #000); mask-image: linear-gradient(transparent, #000); }
  #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(51,32,60,0) 45%, rgba(51,32,60,0.62) 100%); }
  .tag { position: absolute; left: 0; top: 0; opacity: 0; font-weight: 800; font-size: calc(var(--vf-vmin) * 0.036); letter-spacing: 0.06em; white-space: nowrap; color: #33203c; background: #fffaf0; padding: 6px 14px; box-shadow: 0 6px 0 rgba(43,26,48,0.3); will-change: transform; }
  .tag.hot { background: #ff6f61; color: #fff; } .tag.sun { background: #ffd24a; }
  #credit { position: absolute; left: var(--vf-safe-left); right: var(--vf-safe-right); top: calc(var(--vf-safe-top) + 4px); }
  #credit-a { display: inline-block; font-weight: 800; font-size: calc(var(--vf-vmin) * 0.092); line-height: 1.02; color: #fffaf0; background: #33203c; padding: 10px 22px 14px; box-shadow: 0 10px 0 rgba(43,26,48,0.3); }
  #captions .vf-grp.on { background: #33203c !important; padding: 10px 26px 14px; box-shadow: 0 9px 0 rgba(43,26,48,0.32); }
  #captions { position: absolute; left: var(--vf-safe-left); right: var(--vf-safe-right); top: var(--vf-caption-at); height: var(--vf-caption-h); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0">
  <canvas id="gl"></canvas>
  <div class="tilt" id="tilt-top"></div><div class="tilt" id="tilt-bot"></div>
  <div id="vig"></div>
  <div class="tag sun" id="tg-a">PLACEHOLDER TAG</div>
  <div id="credit"><div id="credit-a">PLACEHOLDER TITLE</div></div>
  <div id="captions"></div>
</div>
<script>
  const tl = vfrey.timeline();
  vfrey.captions("#captions", { style: "box", color: "#ffffff", highlight: "#ffd24a", highlightText: "#33203c", maxWords: 4 });
</script>
<script src="scene3d.js"></script>
</body>
</html>
