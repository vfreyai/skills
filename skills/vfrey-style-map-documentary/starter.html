/* lettering lies ON the map so it tilts with the plane */
const lettr = el("g", { "font-family": "Playfair Display,serif", "text-anchor": "middle" }, svg);
[["ATLANTIC", -35, 25, 1], ["INDIAN", 80, -18, 1], ["PACIFIC", 200, 5, 1]].forEach(([t, lo, la]) => { const e = el("text", { x: mx(lo), y: my(la), "font-style": "italic", "font-size": 54, "letter-spacing": 18, fill: "#f6ead0", "fill-opacity": ".46" }, lettr); e.textContent = t; });
[["AFRICA", 20, 5], ["ASIA", 95, 48], ["EUROPE", 15, 52], ["AUSTRALIA", 134, -25]].forEach(([t, lo, la]) => { const e = el("text", { x: mx(lo), y: my(la), "font-size": 38, "letter-spacing": 10, fill: "#3d2e18", "fill-opacity": ".66", "font-weight": "700" }, lettr); e.textContent = t; });

/* ---- route: great circle by slerp, drawn as three strokes, with a plane and its shadow ---- */
const toV = (lo, la) => [Math.cos(la * D2R) * Math.cos(lo * D2R), Math.cos(la * D2R) * Math.sin(lo * D2R), Math.sin(la * D2R)];
const va = toV(A[0], A[1]), vb = toV(B[0], B[1]);
const om = Math.acos(va[0] * vb[0] + va[1] * vb[1] + va[2] * vb[2]);
const NPT = 90, route = [];
for (let i = 0; i <= NPT; i++) { const f = i / NPT, a = Math.sin((1 - f) * om) / Math.sin(om), b = Math.sin(f * om) / Math.sin(om);
  const v = [a * va[0] + b * vb[0], a * va[1] + b * vb[1], a * va[2] + b * vb[2]]; route.push([mx(Math.atan2(v[1], v[0]) / D2R), my(Math.asin(v[2]) / D2R)]); }
const rG = el("path", { fill: "none", stroke: "#ff5a36", "stroke-opacity": ".32", "stroke-width": 22, "stroke-linecap": "round" }, svg);
const rR = el("path", { fill: "none", stroke: "#ff5a36", "stroke-width": 7, "stroke-linecap": "round" }, svg);
const rC = el("path", { fill: "none", stroke: "#ffe3d8", "stroke-width": 2.4, "stroke-linecap": "round" }, svg);
const PLANE = "M0 -50L7 -18L48 6L48 16L7 6L5 34L20 44L20 50L0 44L-20 50L-20 44L-5 34L-7 6L-48 16L-48 6L-7 -18Z";   // 100-unit top-down airliner
const pSh = el("path", { d: PLANE, fill: "#000", "fill-opacity": ".4" }, svg), pBody = el("path", { d: PLANE, fill: "#f6ead0", stroke: "#06101c", "stroke-width": 2 }, svg);
const markers = [A, B].map((p) => { const g = el("g", {}, svg); const x = mx(p[0]), y = my(p[1]);
  const r1 = el("ellipse", { cx: x, cy: y, fill: "none", stroke: "#ff5a36", "stroke-width": 3 }, g), r2 = el("ellipse", { cx: x, cy: y, fill: "none", stroke: "#ff5a36", "stroke-width": 3 }, g);
  el("circle", { cx: x, cy: y, r: 8, fill: "#ff5a36", stroke: "#f6ead0", "stroke-width": 3 }, g); return [r1, r2, x, y]; });

/* ---- state, camera projection (mirrored in CSS and JS), labels with their own height z ---- */
const SS = { fx: mx(A[0]), fy: my(A[1]), k: 1.7, a: 34, u: 0 };      // focus x/y (plane px), zoom, tilt degrees, route progress 0..1
function camProj(x, y, z) { const a = SS.a * D2R, ca = Math.cos(a), sa = Math.sin(a); const px = (x - SS.fx) * SS.k, py = (y - SS.fy) * SS.k, pz = z * SS.k, y2 = py * ca - pz * sa, z2 = py * sa + pz * ca, sc = PERSP / (PERSP - z2); return [540 + px * sc, CY + y2 * sc, sc]; }
const labels = [A, B].map((p, i) => { const d = document.createElement("div"); d.className = "lab city"; d.innerHTML = `${p[2]}<small>${p[3]}</small>`; $("labels").appendChild(d); return d; });
function draw() {
  const t = tl.time();
  $("plane").style.transform = `translate(540px,${CY}px) perspective(${PERSP}px) rotateX(${SS.a}deg) scale(${SS.k}) translate(${-SS.fx}px,${-SS.fy}px)`;
  const n = SS.u * NPT, i = Math.min(NPT - 1, Math.floor(n)), f = n - i, pts = route.slice(0, i + 1);
  if (SS.u > 0) pts.push([lerp(route[i][0], route[i + 1][0], f), lerp(route[i][1], route[i + 1][1], f)]);
  const d = SS.u > 0 ? path(pts, false) : "M0 0"; rG.setAttribute("d", d); rR.setAttribute("d", d); rC.setAttribute("d", d);
  const tip = pts[pts.length - 1], prev = pts[Math.max(0, pts.length - 4)], ang = Math.atan2(tip[1] - prev[1], tip[0] - prev[0]) / D2R + 90, vis = SS.u > 0.001 && SS.u < 0.999 ? 1 : 0;
  pBody.setAttribute("transform", `translate(${tip[0]} ${tip[1]}) rotate(${ang}) scale(.55)`); pBody.setAttribute("opacity", vis);   // plane in the air...
  pSh.setAttribute("transform", `translate(${tip[0] + 8} ${tip[1] + 6}) rotate(${ang}) scale(.55 ${.55 * Math.cos(SS.a * D2R)})`); pSh.setAttribute("opacity", vis);  // ...shadow on the ground
  markers.forEach(([r1, r2, x, y], j) => { const ph = (t * .8 + j * .5) % 1; [[r1, ph], [r2, (ph + .5) % 1]].forEach(([r, p]) => { const rx = 14 + p * 46; r.setAttribute("rx", rx); r.setAttribute("ry", rx * Math.cos(SS.a * D2R)); r.setAttribute("opacity", 1 - p); }); });
  [A, B].forEach((p, j) => { const [sx, sy] = camProj(mx(p[0]), my(p[1]), 60); labels[j].style.transform = `translate(${sx}px,${sy}px) translate(-50%,-100%) scale(${Math.max(.6, Math.min(1.1, camProj(0, 0, 0)[2] * 1.0))})`; });
  $("hudC").textContent = `${(-(SS.fy) > 0 ? "" : "")}${(Math.atan(Math.sinh(-SS.fy / RM)) / D2R).toFixed(1)} N   ${(SS.fx / S).toFixed(1)} E`;
  const cs = $("compass"); if (!cs.firstChild) cs.innerHTML = '<circle cx="85" cy="85" r="60" fill="none" stroke="#efc063" stroke-width="2"/><path d="M85 15L95 85L85 155L75 85Z" fill="#efc063" fill-opacity=".7"/><path d="M15 85L85 75L155 85L85 95Z" fill="#efc063" fill-opacity=".35"/><text x="85" y="12" fill="#f6ead0" font-size="20" text-anchor="middle" font-family="Playfair Display,serif" font-weight="700">N</text>';
}
tl.eventCallback("onUpdate", draw);
vfrey.onFrame(draw);   // what a render runs: onUpdate does not fire when the renderer seeks
tl.to(SS, { duration: vfrey.timing.durationSec, ease: "none", onUpdate: draw }, 0);   // keeps draw() running every frame

/* ---- camera moves: power3.inOut for long glides, sine.inOut for follows. Tilt 26 to 44, k 0.7 to 1.9 ---- */
const mid = [(mx(A[0]) + mx(B[0])) / 2, (my(A[1]) + my(B[1])) / 2];
tl.fromTo(SS, { fx: mx(A[0]), fy: my(A[1]), k: 1.7, a: 34 }, { fx: mx(A[0]) + 30, fy: my(A[1]), k: 1.9, a: 36, duration: 1.6, ease: "sine.inOut", immediateRender: true }, 0);
tl.to(SS, { u: 1, duration: 4.2, ease: "sine.inOut" }, 1.4);                                         // the route draws itself
tl.to(SS, { fx: mid[0], fy: mid[1], k: 0.95, a: 40, duration: 4.4, ease: "power3.inOut" }, 1.4);    // the camera follows, then pulls out
tl.to(SS, { k: 0.78, a: 30, duration: 2.6, ease: "power3.inOut" }, 6.4);                              // wide hold
labels.forEach((l, i) => tl.fromTo(l, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .5, ease: "power2.out", immediateRender: false }, 0.5 + i * 3.8));
/* lower thirds sit at y 1128, always above the plate, one per beat */
function lowerThird(id, t0, t1) { const e = $(id); tl.set(e, { opacity: 0 }, 0); tl.fromTo(e, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: .5, ease: "power3.out", immediateRender: false }, t0); tl.fromTo(e.querySelector(".bar"), { scaleY: 0 }, { scaleY: 1, duration: .5, ease: "power3.out", immediateRender: false }, t0); tl.to(e, { opacity: 0, x: -30, duration: .4, ease: "power2.in" }, t1); }
lowerThird("lt1", 0.8, 4.6); lowerThird("lt2", 6.4, 11.0);

/* ---- caption plate (same place all film): the plate is at the caption band, vfrey draws the words ---- */
{ const cb = vfrey.captionBox, top = cb.top + cb.height - 200; const p = $("plate").style; p.top = top + "px"; p.height = "192px"; const c = $("captions").style; c.top = top + "px"; c.height = "192px"; }
vfrey.captions("#captions", { style: "box", color: "#f6ead0", highlight: "#efc063", highlightText: "#1b1408", maxWords: 4 });   // dark ink on the gold chip (white on gold is 1.8:1)
vfrey.keepInFrame(Array.from(lettr.querySelectorAll("text"))); vfrey.keepInFrame(".lab");   // map lettering the camera carries past the frame edge is hidden, never cut
draw();
</script>
<script>vfrey.fitStage("#root"); /* The design is 9:16 in 1080x1920 px: fitted whole and centred into any frame (16:9 too), never stretched. For a wide video, lay the stage out wide: vfrey.fitStage("#root", { width: 1920, height: 1080 }). */</script>
</body>
