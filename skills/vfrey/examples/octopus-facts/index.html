<!doctype html>
<!-- "3 facts about octopuses": a different idea, so a different picture. Each fact gets a full-screen colour and a huge
     numeral; the octopus watches from the corner. Same helpers: vfrey.line() for when a fact is spoken, vfrey.captions
     for the words. Nothing here came from a template.
     Layout is relative, so it fits any ratio: sizes are fractions of --vf-vmin (the shorter side), edges are the safe areas
     vfrey.js sets (--vf-safe-*, --vf-caption-bottom), and a tall frame and a wide frame get their own arrangement (media
     queries on the frame's aspect ratio). Render it with --aspect 9:16, 1:1 or 16:9 to see all three. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="vfrey/fonts/fonts.css" />
    <script src="vfrey/gsap.min.js"></script>
    <script src="vfrey/vfrey.js"></script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      #root { --m: var(--vf-vmin); position: relative; width: 100%; height: 100%; overflow: hidden; background: #0d47a1; color: #fff; font-family: "Baloo 2", "Noto Sans Arabic", "Noto Sans Bengali", "Noto Sans JP", sans-serif; }
      .panel { position: absolute; inset: 0; opacity: 0; }
      .panel .big { position: absolute; left: 0; right: 0; top: 3%; text-align: center; font-size: calc(var(--m) * 0.38); line-height: 1; }
      .panel .word { position: absolute; left: var(--vf-safe-left); right: var(--vf-safe-right); top: 42%; text-align: center; font-size: calc(var(--m) * 0.09); line-height: 1.05; }
      #intro { opacity: 1; }
      #intro .head { position: absolute; left: var(--vf-safe-left); right: var(--vf-safe-right); top: 15%; text-align: center; font-size: calc(var(--m) * 0.12); line-height: 1.02; }
      #octo { position: absolute; width: calc(var(--m) * 0.22); height: calc(var(--m) * 0.22); left: var(--vf-safe-left); top: 56%; }
      #captions { position: absolute; left: var(--vf-safe-left); right: var(--vf-safe-right); bottom: var(--vf-caption-bottom); height: calc(var(--m) * 0.24); }
      /* A tall frame (9:16): everything bigger, the octopus in the middle of the lower half. */
      @media (max-aspect-ratio: 3/5) {
        .panel .big { top: 11%; font-size: calc(var(--m) * 0.52); }
        .panel .word { top: 44%; font-size: calc(var(--m) * 0.102); }
        #intro .head { font-size: calc(var(--m) * 0.139); top: 15.6%; }
        #octo { width: calc(var(--m) * 0.41); height: calc(var(--m) * 0.41); left: calc(50% - var(--m) * 0.205); top: 52%; }
      }
      /* A wide frame: the numeral on the left half, the words on the right, the octopus under them. */
      @media (min-aspect-ratio: 6/5) {
        .panel .big { right: 50%; top: 8%; font-size: calc(var(--m) * 0.62); }
        .panel .word { left: 50%; top: 30%; text-align: left; font-size: calc(var(--m) * 0.13); }
        #intro .head { top: 26%; font-size: calc(var(--m) * 0.15); }
        #octo { left: auto; right: var(--vf-safe-right); top: 52%; width: calc(var(--m) * 0.3); height: calc(var(--m) * 0.3); }
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0">
      <div class="panel" id="intro"><div class="head">3 facts about octopuses</div></div>
      <div class="panel" id="f1" data-bg="#d84315"><div class="big">1</div><div class="word">three hearts</div></div>
      <div class="panel" id="f2" data-bg="#00838f"><div class="big">2</div><div class="word">blue blood</div></div>
      <div class="panel" id="f3" data-bg="#6a1b9a"><div class="big">3</div><div class="word">nine brains</div></div>
      <img id="octo" src="octopus.svg" alt="" />
      <div id="captions"></div>
    </div>
    <script>
      const tl = vfrey.timeline();
      const T = vfrey.timing;
      // Which spoken line opens each fact: the lines that start with "One.", "Two." and "Three.".
      const opens = ["One", "Two", "Three"].map((w) => T.lines.findIndex((l) => l.text.startsWith(w + ".")));
      const end = T.durationSec;
      const starts = opens.map((i) => (i >= 0 ? vfrey.line(i).start : end));
      // Intro until the first fact; then each fact owns the screen until the next begins; the outro keeps the last colour.
      tl.set("#root", { backgroundColor: "#0d47a1" }, 0);
      ["f1", "f2", "f3"].forEach((id, k) => {
        const at = Math.max(0, starts[k] - 0.05);
        const bg = document.getElementById(id).dataset.bg;
        vfrey.at(at, (tl, t) => {
          tl.set("#root", { backgroundColor: bg }, t);
          tl.set("#intro", { opacity: 0 }, t);
          if (k > 0) tl.set("#f" + k, { opacity: 0 }, t);
          tl.set("#" + id, { opacity: 1 }, t);
          tl.fromTo("#" + id + " .big", { scale: 0.4 }, { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, t);
          tl.fromTo("#" + id + " .word", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, t + 0.15);
        });
      });
      tl.fromTo("#intro .head", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      // The octopus sways all the way through (a finite loop: the video is a known length).
      tl.to("#octo", { rotation: 6, y: -18, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor(end / 1.2) - 1) }, 0);
      vfrey.captions("#captions", { style: "pop", highlight: "#ffd54f", color: "#ffffff", stroke: "#000000" });
    </script>
  </body>
</html>
