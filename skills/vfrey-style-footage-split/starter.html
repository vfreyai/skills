<!doctype html>
<!-- vfrey style rules: change the hero picture on every script line and finish before the line ends (no hold past 3 s); the only numeral on a frame is the one that line says (no count-up through other values); frame 0 already shows a whole word and a picture of the first noun (nothing still entering). Keep scene graphics out of the bottom-right corner: the AI label owns it. -->
<!-- vfrey-demo (vfrey-style-footage-split): none. Every word this starter shows comes from the script (the title, each line's key phrase), and the footage is the person's own, so there is no demo text to replace.
     [] -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="vfrey/fonts/fonts.css" />
<script src="vfrey/gsap.min.js"></script>
<script src="vfrey/vfrey.js"></script>
<!-- STARTER (vfrey-style-footage-split). The person's own footage in one half of the frame (or behind everything), the
     other half for the point being made, captions on a plate. The footage is footage/clip.webm, made by prep-footage.py from
     the project's footage/ folder (only footage the person owns: vfrey never downloads any). Set LAYOUT to "top", "bottom"
     or "full", to match prep-footage.py's --slot. KEYS: one short key phrase per spoken line, or null to pick them from it. -->
<style>
  :root { --acc:#ffd23f; --ink:#0d0f14; --panel:#12151d; --panel2:#1b2030; --txt:#f4f5f8; --mut:#9aa3b8; }
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  *{box-sizing:border-box}
  #root{position:relative;width:100%;height:100%;background:var(--panel);font-family:"Google Sans Flex","Baloo 2",sans-serif;color:var(--txt);overflow:hidden}
  #slot{position:absolute;left:0;width:1080px;overflow:hidden;background:#000}
  #zoom{position:absolute;inset:0}
  #clip{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
  #scrim{position:absolute;inset:0;pointer-events:none}
  #panel{position:absolute;left:0;width:1080px;background:radial-gradient(700px 500px at 80% 20%,rgba(255,210,63,.10),rgba(255,210,63,0) 70%),linear-gradient(180deg,var(--panel2),var(--panel))}
  #seam{position:absolute;left:0;width:1080px;height:8px;background:var(--acc);box-shadow:0 0 30px rgba(255,210,63,.55)}
  #tag{position:absolute;left:50px;height:64px;padding:0 26px;border-radius:32px;background:var(--acc);color:var(--ink);font-size:30px;font-weight:800;line-height:64px;white-space:nowrap;max-width:880px;overflow:hidden;text-overflow:ellipsis}
  #key{position:absolute;left:50px;width:890px;font-size:92px;line-height:1.02;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
  #key .w{display:inline-block;margin-right:.22em}
  #dots{position:absolute;left:50px;height:16px;display:flex;gap:12px}
  .dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.22)}
  #capPlate{position:absolute;left:36px;right:36px;border-radius:40px;background:rgba(13,15,20,.92);border:3px solid rgba(255,255,255,.12);box-shadow:0 18px 60px rgba(0,0,0,.5)}
  #captions{position:absolute;left:var(--vf-safe-left);right:var(--vf-safe-right);top:var(--vf-caption-at);height:var(--vf-caption-h)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0">
  <div id="slot"><div id="zoom"><video id="clip" src="footage/clip.webm" muted playsinline data-start="0" data-track-index="1"></video></div><div id="scrim"></div></div>
  <div id="panel"></div>
  <div id="seam"></div>
  <div id="tag"></div>
  <div id="key"></div>
  <div id="dots"></div>
  <div id="capPlate"></div>
  <div id="captions"></div>
</div>
<script>
(function () {
  const LAYOUT = "top";           // "top": footage above, the point below. "bottom": the point above, footage below. "full": footage behind.
  const KEYS = null;              // ["two words", ...] one per spoken line; null picks the line's longest word and the one after it.
  const T = vfrey.timing, tl = vfrey.timeline(), END = T.durationSec, $ = (q) => document.querySelector(q);
  const H = 960, cb = vfrey.captionBox;
  const slot = $("#slot").style, panel = $("#panel").style, seam = $("#seam").style, tag = $("#tag").style, key = $("#key").style, dots = $("#dots").style;
  if (LAYOUT === "top") {
    slot.top = "0px"; slot.height = H + "px"; panel.top = H + "px"; panel.height = (1920 - H) + "px"; seam.top = (H - 4) + "px";
    tag.top = "214px"; key.top = (H + 44) + "px"; dots.top = (cb.top - 34) + "px";
    $("#scrim").style.background = "linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 32%)";
  } else if (LAYOUT === "bottom") {
    slot.top = H + "px"; slot.height = H + "px"; panel.top = "0px"; panel.height = H + "px"; seam.top = (H - 4) + "px";
    tag.top = "214px"; key.top = "330px"; dots.top = (H - 60) + "px";
  } else {
    slot.top = "0px"; slot.height = "1920px"; panel.display = "none"; seam.display = "none";
    tag.top = "214px"; key.top = "330px"; dots.top = (cb.top - 34) + "px";
    $("#scrim").style.background = "linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.15) 34%,rgba(0,0,0,.1) 55%,rgba(0,0,0,.65))";
  }

  // The tag: the video's title, read from the script (never typed).
  $("#tag").textContent = vfrey.script.title;

  // The key phrase of each spoken line, large, in the panel: the agent's KEYS or the line's longest word and the next.
  const STOP = new Set("the a an and or but of to in on for with that this it is are was were be been you your they their them our we i at by from as so if then than just very really about into over".split(" "));
  const pick = (text) => {
    const words = text.replace(/[^\p{L}\p{N}'’ -]+/gu, " ").split(/\s+/).filter((w) => w && !STOP.has(w.toLowerCase()));
    if (!words.length) return "";
    const at = words.indexOf([...words].sort((a, b) => b.length - a.length)[0]);
    return words.slice(at, at + 2).join(" ");
  };
  const keys = T.lines.map((l, i) => (KEYS && KEYS[i]) || pick(l.text));
  const el = $("#key");
  keys.forEach((k, i) => {
    const L = vfrey.line(i), line = document.createElement("div");
    line.style.position = "absolute"; line.style.left = "0"; line.style.top = "0"; line.style.width = "890px"; line.style.opacity = 0;
    k.split(" ").forEach((w) => { const s = document.createElement("span"); s.className = "w"; s.textContent = w; line.appendChild(s); });
    el.appendChild(line);
    if (k.length > 16) line.style.fontSize = "72px";
    tl.fromTo(line.querySelectorAll(".w"), { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.08 }, Math.max(0, L.start - 0.1));
    tl.set(line, { opacity: 1 }, Math.max(0, L.start - 0.1));
    if (i < keys.length - 1) tl.to(line, { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, Math.max(0.1, vfrey.line(i + 1).start - 0.3));
    const d = document.createElement("div"); d.className = "dot"; $("#dots").appendChild(d);
    tl.to(d, { backgroundColor: "#ffd23f", scale: 1.25, duration: 0.25, ease: "back.out(3)" }, Math.max(0, L.start - 0.1));
  });

  // Motion: the tag and seam in at the start; the footage gets one slow push-in over the film (on the wrapper, never the video).
  // frame 0 already shows the whole tag, seam and footage: nothing is still entering (rule 3)
  tl.fromTo("#zoom", { scale: 1 }, { scale: 1.06, duration: END, ease: "none", transformOrigin: "50% 50%" }, 0);

  // The caption plate: dark, one line, in vfrey's caption band, the same place all film.
  { const p = $("#capPlate").style; p.top = (cb.top + cb.height - 180) + "px"; p.height = "205px"; }
  vfrey.captions("#captions", { style: "color", color: "#f4f5f8", highlight: "#ffd23f", maxWords: 3 });
  vfrey.keepInFrame(Array.from(document.querySelectorAll("#tag, #key .w")));
})();
</script>
<script>vfrey.fitStage("#root"); /* The design is 9:16 in 1080x1920 px: fitted whole and centred into any frame (16:9 too), never stretched. */</script>
</body>
</html>
